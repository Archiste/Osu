<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archiste alias My angel arc | osu! profile</title>
<meta name="description" content="Archiste alias My angel arc's osu! profile: ranks, top plays and a mini playfield.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="card head">
    <div class="av" id="avatar"><span id="initial" aria-hidden="true">A</span></div>
    <div>
      <h1 id="name">Archiste alias My angel arc</h1>
      <span class="mode">osu!standard</span>
      <span class="country" id="country" hidden></span>
    </div>
  </header>

  <div class="card tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-profile" aria-selected="true" aria-controls="p-profile">Profile</button>
    <button role="tab" id="t-plays" aria-selected="false" aria-controls="p-plays">Top plays</button>
    <button role="tab" id="t-play" aria-selected="false" aria-controls="p-play">Play</button>
    <button role="tab" id="t-links" aria-selected="false" aria-controls="p-links">Links</button>
  </div>

  <main>
    <section class="panel" id="p-profile" role="tabpanel" aria-labelledby="t-profile">
      <div class="grid" id="stats"></div>
      <div class="card grades" id="grades" hidden></div>
      <div class="card sync">
        <p><span class="dot"></span>Last synced <b id="snap">--</b>.</p>
        <a class="btn" id="live" href="https://osu.ppy.sh/users/16021128/osu" target="_blank" rel="noopener">View live profile</a>
      </div>
    </section>

    <section class="panel" id="p-plays" role="tabpanel" aria-labelledby="t-plays" hidden>
      <div class="card plays" id="plays"><p class="empty"> Probleme Sync desouler :(</p></div>
    </section>

    <section class="panel" id="p-play" role="tabpanel" aria-labelledby="t-play" hidden>
      <div class="card bar">
        <div class="seg" id="diff" role="group" aria-label="Difficulty">
          <button type="button" data-beats="2" aria-pressed="false">Easy</button>
          <button type="button" data-beats="1" aria-pressed="true">Normal</button>
          <button type="button" data-beats="0.5" aria-pressed="false">Hard</button>
        </div>
        <button class="btn ghost" id="music" type="button" aria-pressed="true">Music: On</button>
        <label class="volume" for="volume">
          Volume
          <input id="volume" type="range" min="0" max="1" step="0.05" value="0.2">
          <span id="volume-value">20%</span>
        </label>
        <span>Best: <b id="best">--</b></span>
      </div>
      <div class="card field" id="field" aria-label="osu! mais nul">
        <div class="hud"><span class="cm" id="combo">0x</span><span id="acc">100.00%</span></div>
        <div class="start" id="start">
          <p>C'est Osu clasique tu connais</p>
          <button class="btn" id="play" type="button">Start</button>
        </div>
      </div>
      <audio id="track" preload="auto" src="Shiawase.vip.mp3"></audio>
    </section>

    <section class="panel" id="p-links" role="tabpanel" aria-labelledby="t-links" hidden>
      <div class="card links" id="links"></div>
    </section>
  </main>
  <footer>Archiste alias My angel arc!</footer>
</div>
<script src="script.js"></script>
</body>
</html>
