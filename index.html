<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archiste | osu! profile</title>
<meta name="description" content="My angel arc's osu! profile: ranks, top plays and a mini playfield.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="card head">
    <div>
      <h1 id="name">Archiste Alias My angel arc </h1>
      <span class="mode">osu!standard</span>
      <span class="country" id="country" title="Country">France</span>
    </div>
  </header>

  <div class="card tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-profile" aria-selected="true" aria-controls="p-profile">Profile</button>
    <button role="tab" id="t-plays" aria-selected="false" aria-controls="p-plays">Top plays</button>
    <button role="tab" id="t-play" aria-selected="false" aria-controls="p-play">Play</button>
    <button role="tab" id="t-links" aria-selected="false" aria-controls="p-links">Links</button>
  </div>

  <main>
    <section class="panel" id="p-profile" role="tabpanel" aria-labelledby="t-profile">
      <div class="grid" id="stats"></div>
      <div class="card grades" id="grades" hidden></div>
      <div class="card sync">
        <p><span class="dot"></span>Last synced <b id="snap">--</b>.</p>
        <a class="btn" id="live" href="https://osu.ppy.sh/users/16021128/osu" target="_blank" rel="noopener">Voir mon profil</a>
      </div>
    </section>

    <section class="panel" id="p-plays" role="tabpanel" aria-labelledby="t-plays" hidden>
      <div class="card plays" id="plays"><p class="empty">Merde j'ai casser le link a mon osu mb je fix au plus vite</p></div>
    </section>

    <section class="panel" id="p-play" role="tabpanel" aria-labelledby="t-play" hidden>
      <div class="card bar">
        <div class="seg" id="diff" role="group" aria-label="Difficulty">
          <button type="button" data-d="900" aria-pressed="false">Easy</button>
          <button type="button" data-d="650" aria-pressed="true">Normal</button>
          <button type="button" data-d="450" aria-pressed="false">Hard</button>
        </div>
        <span>Best: <b id="best">--</b></span>
      </div>
      <div class="card field" id="field" aria-label="osu! mais nul">
        <div class="hud"><span class="cm" id="combo">0x</span><span id="acc">100.00%</span></div>
        <div class="start" id="start">
          <p>Bah c'est Osu mais mal fais quoi.</p>
          <button class="btn" id="play" type="button">Start</button>
        </div>
      </div>
    </section>

    <section class="panel" id="p-links" role="tabpanel" aria-labelledby="t-links" hidden>
      <div class="card links" id="links"></div>
    </section>
  </main>
  <footer>2026 Archiste</footer>
</div>
<script src="script.js"></script>
</body>
</html>
