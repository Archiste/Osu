<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Archiste | osu! profile</title>
<meta name="description" content="Discover Archiste, also known as My Angel Arc, on osu! — profile, stats, top plays and more.">

<link rel="canonical" href="https://archiste.github.io/Osu/">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Archiste">
<meta property="og:url" content="https://archiste.github.io/Osu/">
<meta property="og:title" content="Archiste | osu! profile">
<meta property="og:description" content="My Angel Arc's osu! profile — stats, top plays and more.">
<meta property="og:image" content="https://archiste.github.io/Osu/603b5417633f7c812f95367f5deb0527.png">
<meta property="og:image:alt" content="Archiste osu! profile">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Archiste | osu! profile">
<meta name="twitter:description" content="My Angel Arc's osu! profile — stats, top plays and more.">
<meta name="twitter:image" content="https://archiste.github.io/Osu/603b5417633f7c812f95367f5deb0527.png">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="card head">
    <img class="cover" id="cover" alt="" aria-hidden="true" hidden>
    <div class="av" id="avatar"><span id="initial"></span></div>
    <div>
      <h1 id="name">Archiste Alias My Angel Arc</h1>
      <span class="mode">osu!standard</span>
      <span class="country" id="country" title="Country">France</span>
    </div>
  </header>

  <div class="card tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-profile" aria-selected="true" aria-controls="p-profile">Profile</button>
    <button role="tab" id="t-plays" aria-selected="false" aria-controls="p-plays">Top plays</button>
    <button role="tab" id="t-play" aria-selected="false" aria-controls="p-play">Play</button>
    <button role="tab" id="t-links" aria-selected="false" aria-controls="p-links">Links</button>
  </div>

  <main>
    <section class="panel" id="p-profile" role="tabpanel" aria-labelledby="t-profile">
      <div class="grid" id="stats"></div>
      <div class="card grades" id="grades" hidden></div>
      <div class="card sync">
        <p><span class="dot"></span>Last synced <b id="snap">--</b>.</p>
        <a class="btn" id="live" href="https://osu.ppy.sh/users/16021128/osu" target="_blank" rel="noopener">Voir mon profil</a>
      </div>
    </section>

    <section class="panel" id="p-plays" role="tabpanel" aria-labelledby="t-plays" hidden>
      <div class="card plays" id="plays"><p class="empty">Aucun top play pour le moment.</p></div>
    </section>

    <section class="panel" id="p-play" role="tabpanel" aria-labelledby="t-play" hidden>
      <div class="card bar">
        <div class="seg" id="diff" role="group" aria-label="Difficulty">
          <button type="button" data-beats="2" aria-pressed="false">Easy</button>
          <button type="button" data-beats="1" aria-pressed="true">Normal</button>
          <button type="button" data-beats="0.5" aria-pressed="false">Hard</button>
        </div>
        <button type="button" id="music" class="btn ghost" aria-pressed="true">Music: On</button>
        <label class="volume">Vol
          <input type="range" id="volume" min="0" max="1" step="0.05" value="0.5">
          <span id="volume-value">50%</span>
        </label>
        <span>Best: <b id="best">--</b></span>
      </div>

      <div class="card field" id="field" aria-label="osu! mais nul">
        <div class="hud"><span class="cm" id="combo">0x</span><span id="acc">100.00%</span></div>
        <div class="start" id="start">
          <p>Osu mais de wish.</p>
          <button class="btn" id="play" type="button">Start</button>
        </div>
      </div>

      <audio id="track" src="Shiawase.vip.mp3" preload="auto"></audio>
    </section>

    <section class="panel" id="p-links" role="tabpanel" aria-labelledby="t-links" hidden>
      <div class="card links" id="links"></div>
    </section>
  </main>
  <footer>2026 Archiste</footer>
</div>
<script src="script.js"></script>
</body>
</html>
</html>
